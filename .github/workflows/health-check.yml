# Daily production health check.
#
# This lives here rather than in a Claude cloud routine because that sandbox's
# egress policy refuses outbound connections to our own domains — every request
# came back 000 (connect_rejected) before reaching the server. GitHub runners
# have open network access, cost nothing for this, and store the secret
# encrypted rather than inline in a prompt.
#
# The thinking lives in /health/deep, which returns findings already ranked and
# written in plain language. This job's only job is to call it and shout.

name: Axis health check

on:
  schedule:
    # Two schedules, and which one fired decides whether images are probed.
    #
    # Times are deliberately odd minutes. GitHub's scheduler is best-effort and
    # the top of the hour is its most contended slot — this repo's own history
    # proves it: keep-warm is configured for every 10 minutes and actually runs
    # a handful of times a day, and supabase-keepalive (23 14 * * *) ran at
    # 17:26. Expect "sometime that morning", not 7am sharp.
    #
    # 11:17 UTC = ~7:17am ET in summer, ~6:17am in winter (no DST handling).
    - cron: "17 11 * * *"     # daily — everything except image generation
    - cron: "43 11 * * 0"     # Sundays — adds the image-provider probes
  workflow_dispatch:
    inputs:
      images:
        description: "Probe image generation (costs quota)"
        type: boolean
        default: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Call the deep health check
        id: probe
        env:
          SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
          BACKEND: https://build-backend-jcp9.onrender.com
          # Image probes burn Gemini's image quota, which is far tighter than
          # text — a daily probe was exhausting the very allowance it exists to
          # monitor. Weekly on Sundays, or on demand.
          IMAGES: ${{ (github.event.schedule == '43 11 * * 0' || inputs.images) && '1' || '0' }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::HEALTH_CHECK_SECRET is not set in repository secrets."
            exit 1
          fi
          # Render's free tier sleeps after 15 min; a cold start takes ~90s.
          # Long timeout, and one retry, so a wake-up is never read as an outage.
          for attempt in 1 2; do
            code=$(curl -s -o deep.json -w '%{http_code}' --max-time 300 \
              -H "X-Health-Secret: $SECRET" "$BACKEND/health/deep?images=$IMAGES" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $attempt returned HTTP $code"
            [ "$attempt" = "1" ] && sleep 20
          done
          echo "status=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "::error::/health/deep returned HTTP $code (503 = secret not set on Render, 401 = wrong secret)"
            exit 1
          fi

      - name: Report findings
        run: |
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open("deep.json"))
          problems = d.get("problems") or []
          checks = d.get("checks") or {}

          def line(s): print(s)

          images_probed = "skipped" not in json.dumps(checks.get("image_generation") or {})
          line("## Axis health check"
               + ("" if images_probed else "  _(image probes skipped — weekly)_") + "\n")
          line("**ALL CLEAR**" if d.get("healthy") else f"**PROBLEMS FOUND ({len(problems)})**")

          g = checks.get("gemini", {})
          line(f"\n- Gemini: {len(g.get('models_working') or [])} of "
               f"{len(g.get('models_tried') or [])} models working on {g.get('keys_loaded')} keys")
          for name in ("anthropic", "groq"):
              line(f"- {name.title()}: {'ok' if (checks.get(name) or {}).get('ok') else 'DOWN'}")
          fr = checks.get("find_roofs") or {}
          bad = [c for c, r in fr.items() if not r.get("ok")]
          line(f"- Find Roofs: {len(fr) - len(bad)}/{len(fr)} counties ok"
               + (f" — broken: {', '.join(bad)}" if bad else ""))
          img = checks.get("image_generation") or {}
          if images_probed:
              okimg = [k for k, v in img.items() if v.get("ok")]
              line(f"- Image providers: {len(okimg)}/{len(img)} working"
                   + (f" ({', '.join(okimg)})" if okimg else ""))
          else:
              line("- Image providers: not probed today (weekly, Sundays)")
          rr = checks.get("report_render") or {}
          line(f"- Report render: {'ok' if rr.get('ok') else 'FAILED'} ({rr.get('bytes')} bytes)")
          st = checks.get("storm_report") or {}
          line(f"- Storm report: {'ok' if st.get('ok') else 'FAILED'}")
          mc = checks.get("material_compliance") or {}
          line(f"- Material compliance: {'ok' if mc.get('ok') else 'FAILED'} (shallow check)")

          if problems:
              line("\n### Problems\n")
              for p in problems:
                  line(f"- {p}")

          # Mirror it into the run summary so it is readable without opening logs.
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Axis health check\n\n")
              f.write(("**ALL CLEAR**\n" if d.get("healthy")
                       else f"**PROBLEMS FOUND ({len(problems)})**\n\n"))
              for p in problems:
                  f.write(f"- {p}\n")

          # Fail the run only on real severity. WARN-only mornings stay green so
          # a red badge keeps meaning something.
          severe = [p for p in problems if p.startswith(("CRITICAL", "HIGH"))]
          if severe:
              print(f"::error::{len(severe)} severe problem(s) — see summary")
              sys.exit(1)
          PY

  # ── Homepage integrity ────────────────────────────────────────────────
  # Separate job, no secret, no backend. It exists because the hero reel has
  # twice now degraded silently rather than breaking: first by buffering only
  # 14s of a 25s file, then by a bandwidth probe so short that one slow TLS
  # handshake pinned the whole session to the 720p cut. Neither threw an error
  # and neither showed up in any check — they just looked bad.
  #
  # So this asserts the two things that actually rot: that the fixes are still
  # in the served HTML, and that every reel tier is still there at full size.
  # All of it is deterministic curl + string matching, no browser, so a red
  # badge here always means something real. See the comments on each check for
  # what regressing it would look like to a visitor.
  homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live homepage and reel assets
        run: |
          BASE=https://www.axisroofingperformance.com
          code=$(curl -sS -o home.html -w '%{http_code}' --max-time 60 -D head.txt "$BASE/" || echo 000)
          echo "home=$code" > status.txt
          # The homepage carries a snapshot of the plans so pricing shows while
          # the backend is cold; compare it with the real thing below. 120s
          # because the free Render instance can take ~75s to wake.
          curl -sS -o plans.json --max-time 120 \
            https://build-backend-jcp9.onrender.com/api/v1/billing/plans || echo '{}' > plans.json
          # Range request: the reel is fetched as a blob, but 206 support is
          # what lets the browser stream it at all if that path ever fails.
          for f in reel-hd.mp4 reel-sd.mp4 reel-preview.mp4 reel-poster.jpg; do
            line=$(curl -sS -o /dev/null --max-time 60 -r 0-1 \
              -w '%{http_code} %{content_type} %{size_download}' "$BASE/v2/$f" || echo "000 - 0")
            len=$(curl -sS -o /dev/null --max-time 60 -r 0-1 -D - "$BASE/v2/$f" 2>/dev/null \
              | tr -d '\r' | awk -F'/' '/^[Cc]ontent-[Rr]ange:/{print $2}')
            echo "$f $line ${len:-0}" >> status.txt
          done
          cat status.txt

      - name: Check it
        run: |
          python3 - <<'PY'
          import os, re, sys

          html = open("home.html", encoding="utf-8", errors="replace").read()
          headers = open("head.txt", encoding="utf-8", errors="replace").read().lower()
          status = dict(l.split("=", 1) for l in open("status.txt") if "=" in l)
          assets = [l.split() for l in open("status.txt") if not l.startswith("home=")]

          problems, notes = [], []

          if status.get("home", "").strip() != "200":
              problems.append(f"CRITICAL homepage returned HTTP {status.get('home','?').strip()}")
          if "/home-v2.html" not in headers:
              problems.append("HIGH  / is no longer rewritten to home-v2.html — "
                              "next.config.ts rewrite may have been dropped, so visitors "
                              "are getting the dead app/page.tsx landing instead")

          # Strip CSS/JS block comments before looking for snapping: the file
          # deliberately NAMES scroll-snap-type in the comment explaining why it
          # was removed, and that comment must not trip this check.
          bare = re.sub(r"/\*.*?\*/", "", html, flags=re.S)

          # (fix, must_be_present, what a visitor sees if it regresses)
          CHECKS = [
              ("fetchBlobAdaptive", True,
               "the reel tier is chosen by a bandwidth guess again — random blurry loads"),
              ("const TAU", True,
               "scrub easing is a per-frame rate again — settles twice as fast on 120Hz"),
              ("data-settled", True,
               "poster and preview layers never release — three full-screen layers stay live"),
              ("measuredKbps", False,
               "the 297KB bandwidth probe is back — one slow handshake pins the session to 720p"),
              ('class="snap"', False,
               "scroll-snap markers are back — the page fights the scroll and the reel jerks"),
              ("readyState>=2", True,
               "the paint check depends on requestVideoFrameCallback alone again — "
               "Firefox and Safari below 15.4 show a frozen poster and no reel at all"),
              (".fastSeek(", False,
               "fastSeek is back — WebKit and Gecko snap it to the nearest keyframe, so "
               "Safari and Firefox lurch through 12 positions where Chrome shows 91. "
               "(The file names fastSeek in comments without the dot, so this string "
               "matches only a real call.)"),
          ]
          for needle, want_present, effect in CHECKS:
              present = needle in html
              if present != want_present:
                  problems.append(f"HIGH  homepage regressed ({'lost' if want_present else 'reintroduced'} "
                                  f"`{needle}`): {effect}")

          if "scroll-snap-type" in bare:
              problems.append("HIGH  an active scroll-snap rule is back on the homepage: "
                              "it fights the gesture and drags the scrubbed reel with it")

          # Homepage pricing snapshot vs the plans the backend actually charges.
          # Visitors see the snapshot first (and only, if the backend is slow),
          # so a price change in plans.py that skips the homepage would show
          # one price on the page and charge another at checkout.
          import json
          m = re.search(r'<script type="application/json" id="plansData">(.*?)</script>', html, re.S)
          try:
              live = json.load(open("plans.json"))
          except Exception:
              live = {}
          if not m:
              problems.append("HIGH  the homepage pricing snapshot (#plansData) is missing — "
                              "the Pricing section will render empty")
          elif live.get("plans"):
              snap = json.loads(m.group(1))
              fields = ("monthly_usd", "annual_usd", "annual_monthly_equivalent",
                        "reports", "reports_unlimited", "crews", "crews_unlimited")
              s_by = {p["key"]: p for p in snap.get("plans", [])}
              l_by = {p["key"]: p for p in live["plans"]}
              drift = []
              if set(s_by) != set(l_by):
                  drift.append(f"plans {sorted(s_by)} on the page vs {sorted(l_by)} live")
              for k in set(s_by) & set(l_by):
                  for f in fields:
                      if s_by[k].get(f) != l_by[k].get(f):
                          drift.append(f"{k}.{f}: page {s_by[k].get(f)} vs live {l_by[k].get(f)}")
              if snap.get("overage_report_usd") != live.get("overage_report_usd"):
                  drift.append(f"overage: page {snap.get('overage_report_usd')} vs live {live.get('overage_report_usd')}")
              if drift:
                  problems.append("HIGH  homepage pricing is out of date with app/core/plans.py — "
                                  "update #plansData in home-v2.html: " + "; ".join(drift))
          else:
              notes.append("plans endpoint did not answer, so homepage pricing was not compared")

          # Every tier must still be there, and still be big enough to be the
          # quality it claims. A shrunken reel-hd is how 'it went blurry' would
          # look if someone re-encoded or replaced it.
          FLOOR = {"reel-hd.mp4": 8_000_000, "reel-sd.mp4": 3_000_000,
                   "reel-preview.mp4": 200_000, "reel-poster.jpg": 100_000}
          for row in assets:
              if len(row) < 4:
                  problems.append(f"HIGH  could not probe {row[0] if row else '?'}")
                  continue
              name, code, ctype, total = row[0], row[1], row[2], int(row[-1] or 0)
              if code not in ("200", "206"):
                  problems.append(f"CRITICAL /v2/{name} returned HTTP {code} — "
                                  "the hero falls back to a lower tier or the poster")
                  continue
              if not (ctype.startswith("video/") or ctype.startswith("image/")):
                  problems.append(f"HIGH  /v2/{name} served as {ctype}")
              floor = FLOOR.get(name, 0)
              if total < floor:
                  problems.append(f"HIGH  /v2/{name} is {total:,} bytes, under the "
                                  f"{floor:,} floor — it has been re-encoded or replaced "
                                  "with something lower quality")
              else:
                  notes.append(f"- {name}: {code}, {total:,} bytes")

          title = "## Axis homepage integrity\n\n"
          body = ("**ALL CLEAR**\n" if not problems
                  else f"**PROBLEMS FOUND ({len(problems)})**\n\n"
                       + "".join(f"- {p}\n" for p in problems))
          body += "\n" + "\n".join(notes) + "\n"
          print(title + body)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(title + body)

          severe = [p for p in problems if p.startswith(("CRITICAL", "HIGH"))]
          if severe:
              print(f"::error::{len(severe)} homepage problem(s) — see summary")
              sys.exit(1)
          PY
